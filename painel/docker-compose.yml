# ============================================================================
# Painel Backup CH.Com
#
#   docker compose up -d --build     sobe
#   docker compose logs -f           acompanha os logs
#   docker compose down              para (sem apagar o banco)
#
# O banco vive no volume `dados`, então parar e subir de novo NÃO apaga o
# histórico. Para apagar de verdade: docker compose down -v
# ============================================================================

services:
  painel:
    build: .
    container_name: painel-backup-chcom
    restart: unless-stopped

    ports:
      # Só na interface local. Quando o painel for para o servidor Linux,
      # quem fala com a internet é o proxy HTTPS na frente — o Node nunca
      # deve ficar exposto direto, porque não faz TLS.
      - '127.0.0.1:3000:3000'

    environment:
      NODE_ENV: production
      PORT: '3000'
      DB_PATH: /dados/painel.db

    volumes:
      - dados:/dados

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dados:
